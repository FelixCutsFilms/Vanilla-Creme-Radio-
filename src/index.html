<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla Creme Radio</title>
  <style>
    :root {
      --bg:      #EAE6D4;
      --bg2:     #E0DBCA;
      --bg3:     #D5D0BF;
      --border:  #C8C3B0;
      --text:    #0d0d0d;
      --text2:   #84739C;
      --text3:   #A090B8;
      --accent:  #84739C;
      --accent2: #9D8DB5;
      --red:     #5a3a3a;
      --radius:  6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    input, select, textarea {
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }
    select { cursor: pointer; }

    /* ── Header ── */
    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex-shrink: 0;
    }
    header:hover { background: var(--bg2); }
    .header-left { flex: 1; min-width: 0; }
    .label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text3); }
    #now-playing { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; text-transform: uppercase; }
    #now-genre   { font-size: 11px; color: var(--text3); margin-top: 1px; }
    #now-track   { font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; }
    /* Marquee-Lauftext für lange Interpret/Titel & Sendernamen */
    .mq-inner { display: inline-block; white-space: nowrap; }
    .mq-inner.mq-run { animation: mq-scroll linear infinite; }
    .mq-inner.mq-run > span { display: inline-block; padding-right: 44px; }
    @keyframes mq-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    #play-btn {
      width: 32px; height: 32px; border-radius: var(--radius);
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; flex-shrink: 0;
    }
    #play-btn:hover { background: var(--text); }
    #play-btn svg { fill: #EAE6D4; }

    #toggle-btn {
      width: 28px; height: 28px; border-radius: var(--radius);
      background: none; border: 1px solid var(--border); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
    }
    #toggle-btn:hover { background: var(--bg3); }
    #toggle-btn svg { transition: transform 0.25s; }
    body.collapsed #toggle-btn svg { transform: rotate(180deg); }

    #pin-btn {
      width: 28px; height: 28px; border-radius: var(--radius);
      background: none; border: 1px solid var(--border); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, border-color 0.15s;
    }
    #pin-btn:hover { background: var(--bg3); }
    #pin-btn svg { fill: var(--text3); transition: fill 0.15s; }
    #pin-btn.pinned { background: var(--accent); border-color: var(--accent); }
    #pin-btn.pinned svg { fill: #EAE6D4; }

    /* ── Collapsible Panel ── */
    #panel {
      display: flex; flex-direction: column; flex: 1; overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.2s;
      max-height: 2000px; opacity: 1;
    }
    body.collapsed #panel { max-height: 0; opacity: 0; pointer-events: none; }

    /* ── Tabs ── */
    #tabs {
      display: flex; border-bottom: 1px solid var(--border);
      background: var(--bg); flex-shrink: 0;
    }
    .tab-btn {
      flex: 1; padding: 8px 4px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3);
      background: none; border: none; cursor: pointer;
      border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--text2); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Tab Pages ── */
    .tab-page { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .tab-page.active { display: flex; }

    /* ── Genre Filter Bar (Meine Sender) ── */
    #genre-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-bottom: 1px solid var(--border);
      flex-shrink: 0; background: var(--bg);
    }
    #genre-bar label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); white-space: nowrap; }
    #genre-filter {
      flex: 1; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 12px;
      font-weight: 600; padding: 5px 9px; outline: none; -webkit-appearance: none;
      cursor: pointer; transition: border-color 0.15s;
    }
    #genre-filter:focus { border-color: var(--accent2); }

    /* ── Station List (shared) ── */
    .station-list {
      flex: 1; overflow-y: auto; padding: 4px 0;
    }
    .station-list::-webkit-scrollbar { width: 4px; }
    .station-list::-webkit-scrollbar-track { background: transparent; }
    .station-list::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }

    .station {
      display: flex; align-items: center;
      padding: 8px 10px; cursor: pointer; gap: 10px;
      border-radius: 8px; margin: 2px 8px;
      transition: background 0.1s;
    }
    .station { position: relative; }
    .station.dragging  { opacity: 0.3; pointer-events: none; }
    .station.insert-before::before,
    .station.insert-after::after {
      content: '';
      position: absolute;
      left: 10px; right: 10px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
      pointer-events: none;
    }
    .station.insert-before::before { top: -1px; }
    .station.insert-after::after   { bottom: -1px; }
    .station:hover { background: var(--bg2); }
    .station.active { background: var(--bg3); }

    .drag-handle {
      color: var(--border); cursor: grab; flex-shrink: 0; display: flex; align-items: center; padding: 0 2px;
      opacity: 0; transition: opacity 0.15s;
    }
    .station:hover .drag-handle { opacity: 1; }
    .drag-handle:active { cursor: grabbing; }

    .station-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--border); flex-shrink: 0; transition: background 0.2s;
    }
    .station.active .station-dot { background: var(--accent); }

    .station-info { flex: 1; min-width: 0; }
    .station-name {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text);
      text-transform: uppercase;
    }
    .station.active .station-name { font-weight: 600; }
    .station-sub { font-size: 10px; color: var(--text3); margin-top: 1px; }

    /* ── Inline Edit Row ── */
    .station-edit {
      display: none; flex-direction: column; gap: 5px;
      padding: 6px 10px 8px 28px; margin: 0 8px 4px;
      background: var(--bg2); border-radius: 8px;
    }
    .station-edit.open { display: flex; }
    .station-edit input, .station-edit select {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 12px; padding: 5px 8px; outline: none;
      -webkit-appearance: none; transition: border-color 0.15s; width: 100%;
    }
    .station-edit input:focus, .station-edit select:focus { border-color: var(--accent2); }
    .station-edit-actions { display: flex; gap: 6px; }
    .edit-save-btn {
      background: var(--accent); border: none; border-radius: 6px;
      color: #EAE6D4; font-size: 11px; font-weight: 600;
      padding: 5px 12px; cursor: pointer; transition: background 0.1s;
    }
    .edit-save-btn:hover { background: var(--text); }
    .edit-cancel-btn {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--text3); font-size: 11px; padding: 5px 10px;
      cursor: pointer; transition: background 0.1s;
    }
    .edit-cancel-btn:hover { background: var(--bg3); }

    .action-btn {
      background: none; border: none; cursor: pointer;
      line-height: 1; padding: 4px 5px;
      border-radius: 6px; transition: color 0.1s, background 0.1s; flex-shrink: 0;
    }
    .edit-btn  { color: var(--text3); font-size: 13px; }
    .edit-btn:hover  { color: var(--accent); background: var(--bg2); }
    .remove-btn { color: var(--bg3); font-size: 15px; }
    .remove-btn:hover { color: var(--red); background: var(--bg2); }
    .add-btn { color: var(--text3); font-size: 17px; }
    .add-btn:hover { color: var(--accent); background: var(--bg2); }

    .empty-msg { padding: 24px 16px; font-size: 12px; color: var(--text3); text-align: center; }

    /* ── Discover Filters ── */
    #discover-filters {
      display: flex; flex-direction: column; gap: 8px;
      padding: 10px 16px 8px; border-bottom: 1px solid var(--border);
      flex-shrink: 0; background: var(--bg);
    }

    /* Genre Chips */
    #genre-chips {
      display: flex; flex-wrap: wrap; gap: 5px;
    }
    .d-chip {
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      border-radius: 20px; border: 1px solid var(--border);
      background: none; color: var(--text2); cursor: pointer;
      white-space: nowrap; transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .d-chip:hover { background: var(--bg2); }
    .d-chip.active { background: var(--accent); color: #EAE6D4; border-color: var(--accent); }

    /* Country + Search row */
    .d-row { display: flex; gap: 6px; align-items: center; }
    .d-row select, .d-row input {
      flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 12px;
      padding: 6px 9px; outline: none; -webkit-appearance: none;
      transition: border-color 0.15s;
    }
    .d-row select:focus, .d-row input:focus { border-color: var(--accent2); }
    .d-row button {
      background: var(--accent); border: none; border-radius: var(--radius);
      color: #EAE6D4; font-size: 12px; font-weight: 600;
      padding: 6px 12px; cursor: pointer; transition: background 0.1s; white-space: nowrap;
      flex-shrink: 0;
    }
    .d-row button:hover { background: var(--text); }
    .d-row button:disabled { background: var(--bg3); color: var(--text3); cursor: default; }

    #discover-status { font-size: 11px; color: var(--text3); }

    /* ── Volume + Status ── */
    #vol-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-top: 1px solid var(--border); flex-shrink: 0;
    }
    #status-wrap { flex: 1; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    #status { font-size: 11px; color: var(--text3); white-space: nowrap; }
    #status.playing { color: var(--accent); }
    #status.loading { color: var(--accent2); }
    #status.error   { color: var(--red); }
    #bar-track { font-size: 11px; color: var(--text3); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

    /* ── Seek-Leiste für DJ Sets (nicht Live) ── */
    #seek-row {
      display: none; align-items: center; gap: 8px;
      padding: 6px 16px 0; flex-shrink: 0;
    }
    #seek-row.on { display: flex; }
    #seek-cur, #seek-dur { font-size: 10px; color: var(--text3); white-space: nowrap; font-variant-numeric: tabular-nums; }
    #seek-bar {
      flex: 1; height: 4px; background: var(--border); border-radius: 2px;
      cursor: pointer; position: relative; min-width: 0;
    }
    #seek-bar::after {
      content: ''; position: absolute; top: -6px; bottom: -6px; left: 0; right: 0;
    }
    #seek-fill {
      height: 100%; width: 0%; background: var(--accent);
      border-radius: 2px; pointer-events: none;
    }
    #seek-knob {
      position: absolute; top: 50%; width: 11px; height: 11px; margin-left: -5px;
      transform: translateY(-50%); border-radius: 50%; background: var(--accent);
      pointer-events: none; left: 0%;
    }

    #volume {
      -webkit-appearance: none; width: 70px; height: 3px;
      background: var(--border); border-radius: 2px; outline: none;
    }
    #volume::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: var(--accent); cursor: pointer;
    }

    /* ── Add Form ── */
    #add-section { border-top: 1px solid var(--border); flex-shrink: 0; }
    #add-toggle {
      width: 100%; background: none; border: none; padding: 8px 16px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
      color: var(--text3); cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 6px; transition: background 0.1s, color 0.1s;
    }
    #add-toggle:hover { background: var(--bg2); color: var(--text2); }
    #add-toggle .plus { font-size: 14px; line-height: 1; color: var(--accent2); }
    #add-form { padding: 4px 16px 14px; display: none; flex-direction: column; gap: 6px; }
    #add-form.open { display: flex; }
    .form-row { display: flex; gap: 6px; }
    #add-form input, #add-form select {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 12px;
      padding: 6px 9px; outline: none; transition: border-color 0.15s; -webkit-appearance: none;
    }
    #add-form input:focus, #add-form select:focus { border-color: var(--accent2); }
    #add-form input[name="name"], #add-form input[name="url"], #add-form input[name="newgenre"] { flex: 1; }
    #add-form select[name="genre"] { flex: 1; }
    #add-form button {
      background: var(--accent); border: none; border-radius: var(--radius);
      color: #EAE6D4; font-size: 12px; font-weight: 600; padding: 6px 12px;
      cursor: pointer; transition: background 0.1s; white-space: nowrap;
    }
    #add-form button:hover { background: var(--text); }
    .form-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); padding-left: 1px; }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header id="header">
  <div class="header-left">
    <div class="label">Vanilla Creme Radio</div>
    <div id="now-playing">Kein Sender</div>
    <div id="now-genre"></div>
    <div id="now-track"></div>
  </div>
  <div class="header-right">
    <button id="play-btn" title="Play/Pause (Leertaste)" onclick="event.stopPropagation()">
      <svg id="play-icon" width="14" height="14" viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>
    </button>
    <button id="pin-btn" title="Fenster anpinnen">
      <svg width="13" height="14" viewBox="0 0 20 22" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- Kopfplatte -->
        <rect x="4" y="1" width="12" height="2.5" rx="0.5" fill="currentColor" stroke="none"/>
        <!-- Körper trapezförmig -->
        <path d="M5.5 3.5 L4.5 11 L9.5 11 L9.5 17 L10.5 17 L10.5 11 L15.5 11 L14.5 3.5 Z" fill="currentColor" stroke="none"/>
        <!-- Nadel -->
        <line x1="10" y1="17" x2="10" y2="21" stroke-width="1.8"/>
      </svg>
    </button>
    <button id="toggle-btn" title="Auf-/Zuklappen">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <polyline points="2,4 6,8 10,4" stroke="#84739C" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>

<!-- ── Panel ── -->
<div id="panel">

  <!-- Tabs -->
  <div id="tabs">
    <button class="tab-btn active" data-tab="mine">Meine Sender</button>
    <button class="tab-btn" data-tab="discover">Entdecken</button>
  </div>

  <!-- ── Tab: Meine Sender ── -->
  <div class="tab-page active" id="tab-mine">
    <div id="genre-bar">
      <label>Genre</label>
      <select id="genre-filter"></select>
    </div>
    <div class="station-list" id="station-list"></div>
    <div id="add-section">
      <button id="add-toggle"><span class="plus">+</span><span class="add-label"> SENDER HINZUFÜGEN</span></button>
      <form id="add-form" autocomplete="off">
        <div class="form-label">Name &amp; Genre</div>
        <div class="form-row">
          <input name="name" placeholder="Sendername" required />
          <select name="genre" id="genre-select"></select>
        </div>
        <div class="form-label">Stream-URL</div>
        <div class="form-row"><input name="url" placeholder="http://..." required /></div>
        <div class="form-label">Neues Genre (optional)</div>
        <div class="form-row">
          <input name="newgenre" placeholder="z.B. Jazz, Techno, News…" />
          <button type="submit">Hinzufügen</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Tab: Entdecken ── -->
  <div class="tab-page" id="tab-discover">
    <div id="discover-filters">
      <div id="genre-chips"><!-- filled by JS --></div>
      <div class="d-row">
        <select id="f-country"><option value="">🌍 Alle Länder</option></select>
        <select id="f-djgenre" style="display:none"></select>
        <input id="f-network" placeholder="Sender / Netzwerk suchen…" />
        <button id="search-btn">Suchen</button>
      </div>
      <div id="dj-hint" style="display:none;font-size:11px;color:var(--text3);padding:2px 2px 4px;">via hearthis.at — Genre wählen oder DJ suchen</div>
      <div id="discover-status"></div>
    </div>
    <div class="station-list" id="discover-list"></div>
  </div>

  <!-- Seek-Leiste (nur DJ Sets, nicht Live) -->
  <div id="seek-row">
    <span id="seek-cur">0:00</span>
    <div id="seek-bar"><div id="seek-fill"></div><div id="seek-knob"></div></div>
    <span id="seek-dur">0:00</span>
  </div>

  <!-- Volume + Status (shared) -->
  <div id="vol-row">
    <div id="status-wrap">
      <span id="status">–</span>
      <span id="bar-track"></span>
    </div>
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
      <path d="M1 5h3l4-3v12l-4-3H1z" fill="#A090B8"/>
      <path d="M11 4a5 5 0 0 1 0 8" stroke="#A090B8" stroke-width="1.5" fill="none"/>
    </svg>
    <input type="range" id="volume" min="0" max="1" step="0.02" value="0.8" />
  </div>

</div>

<audio id="audio"></audio>
<audio id="audio-dj"></audio>

<script>
  const API = 'https://de1.api.radio-browser.info/json';

  // Radio-Browser-Abfrage über Rust (Mirror-Fallback, kein WebView-Netzwerk-Quirk)
  async function radioApi(path) {
    const raw = await window.__TAURI__.core.invoke('fetch_radio', { path });
    return JSON.parse(raw);
  }

  const audio      = document.getElementById('audio');
  const audioDj    = document.getElementById('audio-dj');
  let   isDjMode   = false;

  // Web Audio API: Compressor + EQ + Gain
  let audioCtx, sourceNode, muteGain, audioReady = false;
  function setupAudioChain() {
    if (audioReady) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sourceNode = audioCtx.createMediaElementSource(audio);

      const bass = audioCtx.createBiquadFilter();
      bass.type = 'lowShelf';
      bass.frequency.value = 120;
      bass.gain.value = 10;

      const treble = audioCtx.createBiquadFilter();
      treble.type = 'highShelf';
      treble.frequency.value = 6000;
      treble.gain.value = 2.5;

      const compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -18;
      compressor.knee.value = 10;
      compressor.ratio.value = 3;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.25;

      const masterGain = audioCtx.createGain();
      masterGain.gain.value = 1.4;

      // muteGain als Stummschalter — einziger zuverlässiger Weg in WebKit
      muteGain = audioCtx.createGain();
      muteGain.gain.value = 1;

      sourceNode.connect(bass);
      bass.connect(treble);
      treble.connect(compressor);
      compressor.connect(masterGain);
      masterGain.connect(muteGain);
      muteGain.connect(audioCtx.destination);
      audioReady = true;
    } catch(e) {}
  }
  // Stellt sicher dass die Web-Audio-Chain aktiv ist und muteGain offen —
  // WebKit suspendiert den AudioContext sobald das Radio-Element pausiert
  // (z.B. während ein DJ-Set auf dem zweiten Element läuft). Ohne erneutes
  // resume() würde das Radio danach roh (ohne Bass/Kompressor) abgespielt.
  function ensureRadioChain() {
    setupAudioChain();
    if (!audioCtx) return;
    const reopen = () => {
      if (!muteGain) return;
      const now = audioCtx.currentTime;
      muteGain.gain.cancelScheduledValues(now);
      muteGain.gain.setValueAtTime(1, now);
    };
    if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
      audioCtx.resume().then(reopen).catch(() => {});
    } else {
      reopen();
    }
  }
  audio.addEventListener('play', ensureRadioChain);

  const playBtn    = document.getElementById('play-btn');
  const playIcon   = document.getElementById('play-icon');
  const statusEl   = document.getElementById('status');
  const nowPlaying = document.getElementById('now-playing');
  const nowGenreEl = document.getElementById('now-genre');
  const nowTrackEl = document.getElementById('now-track');
  const barTrackEl = document.getElementById('bar-track');
  const volumeEl   = document.getElementById('volume');

  // Langen Text als Laufschrift anzeigen, wenn er nicht in den Container passt
  function setScrollingText(el, text) {
    text = text || '';
    el.innerHTML = '';

        const b = document.createElement('span'); b.textContent = text;
        inner.appendChild(a); inner.appendChild(b);
        inner.classList.add('mq-run');

  function fmtTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2, '0')}`;
  }
  function resetSeek() {
    seekFill.style.width = '0%';

  audioDj.addEventListener('timeupdate', () => {
    if (!isDjMode || currentDjIsLive || !isFinite(audioDj.duration) || !audioDj.duration) return;
    const pct = (audioDj.currentTime / audioDj.duration) * 100;
    seekFill.style.width = pct + '%';
    seekKnob.style.left = pct + '%';
    seekCur.textContent = fmtTime(audioDj.currentTime);
  });
  function seekFromEvent(e) {
    if (currentDjIsLive || !isFinite(audioDj.duration) || !audioDj.duration) return;
    const rect = seekBar.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    audioDj.currentTime = frac * audioDj.duration;

        document.querySelectorAll('.station-edit.open').forEach(p => p.classList.remove('open'));
        if (!isOpen) { editPanel.classList.add('open'); editPanel.querySelector('.edit-name').focus(); }
      });

      // Save
      editPanel.querySelector('.edit-save-btn').addEventListener('click', () => {
        const newName  = editPanel.querySelector('.edit-name').value.trim();
        const newGenre = editPanel.querySelector('.edit-newgenre').value.trim() || genreSel.value;
        if (!newName) return;
        if (newGenre && !genres.includes(newGenre)) genres.push(newGenre);

        saveData(); renderGenreBar(); renderMyList();

      // Cancel
      editPanel.querySelector('.edit-cancel-btn').addEventListener('click', () => {
        editPanel.classList.remove('open');
      });

      // Drag per mousedown auf den Handle (kein HTML5-Drag-API, WebKit-kompatibel)
      drag.addEventListener('mousedown', e => {
        e.preventDefault();
        e.stopPropagation();
        const fromIdx = s.idx;
        let lastOver = null;

        const clearOver = () => document.querySelectorAll('.station.insert-before,.station.insert-after').forEach(el => { el.classList.remove('insert-before','insert-after'); });

        row.classList.add('dragging');

        let insertBefore = true;

        const onMove = ev => {
          const el = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.station');
          clearOver();
          if (el && el !== row) {
            const rect = el.getBoundingClientRect();
            insertBefore = ev.clientY < rect.top + rect.height / 2;
            el.classList.add(insertBefore ? 'insert-before' : 'insert-after');
            lastOver = el;
          } else {
            lastOver = null;
          }
        };

        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          row.classList.remove('dragging');
          const target = lastOver;
          clearOver();
          if (!target) return;
          const toIdx = parseInt(target.dataset.origIdx);
          if (isNaN(toIdx) || toIdx === fromIdx) return;
          const insertIdx = insertBefore ? toIdx : toIdx + 1;
          const moved = stations.splice(fromIdx, 1)[0];
          const adjustedIdx = insertIdx > fromIdx ? insertIdx - 1 : insertIdx;
          stations.splice(adjustedIdx, 0, moved);
          if (currentIdx === fromIdx) currentIdx = adjustedIdx;
          else if (currentIdx > fromIdx && currentIdx <= adjustedIdx) currentIdx--;
          else if (currentIdx < fromIdx && currentIdx >= adjustedIdx) currentIdx++;
          saveData(); renderMyList();
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      // Play on row click
      row.addEventListener('click', e => {
        if (e.target.classList.contains('edit-btn') || e.target.classList.contains('remove-btn')) return;
        selectStation(s.idx);
      });

      // Remove
      rmBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (s.idx === currentIdx) { audio.pause(); audio.src=''; playing=false; currentIdx=-1; setScrollingText(nowPlaying, 'Kein Sender'); nowGenreEl.textContent=''; setStatus('','–'); updatePlayBtn(); }
        else if (s.idx < currentIdx) currentIdx--;
        stations.splice(s.idx, 1); saveData(); renderGenreBar(); renderMyList();
      });

      list.appendChild(row);
      list.appendChild(editPanel);
    });
  }

    const cSel = document.getElementById('f-country');
    const current = cSel.value;
    cSel.innerHTML = '<option value="">🌍 Alle Länder</option>';
    try {
      if (!activeDiscoverTag || activeDiscoverTag === '__top__') {
        // Kein Genre: alle Länder mit Gesamtanzahl
        const countries = await radioApi(`countries?hidebroken=true&order=name&limit=300`);
        countries.filter(c => c.stationcount > 0).forEach(c => {
          const o = document.createElement('option');
          o.value = c.iso_3166_1;
          o.textContent = `${c.name} (${c.stationcount})`;
          if (c.iso_3166_1 === current) o.selected = true;
          cSel.appendChild(o);
        });
      } else {
        // Genre aktiv: Stationen laden und Länder selbst zählen
        const stations = await radioApi(`stations/search?tag=${encodeURIComponent(activeDiscoverTag)}&hidebroken=true&limit=3000`);
        const counts = {}, names = {};
        stations.forEach(s => {
          if (!s.countrycode) return;
          counts[s.countrycode] = (counts[s.countrycode] || 0) + 1;
          if (s.country) names[s.countrycode] = s.country;
        });
        Object.entries(counts)
          .sort((a, b) => (names[a[0]] || '').localeCompare(names[b[0]] || ''))
          .forEach(([code, count]) => {
            const o = document.createElement('option');
            o.value = code;
            o.textContent = `${names[code] || code} (${count})`;
            if (code === current) o.selected = true;
            cSel.appendChild(o);

      return;
    }

    const country = document.getElementById('f-country').value;
    const isTop = activeDiscoverTag === '__top__';
    const params = new URLSearchParams({ hidebroken: 'true', order: 'votes', reverse: 'true', limit: '80' });
    if (country)                          params.set('countrycode', country);
    if (activeDiscoverTag && !isTop)      params.set('tag', activeDiscoverTag);
    if (network)                          params.set('name', network);

    try {
      const results = await radioApi(`stations/search?${params}`);
      btn.disabled = false; btn.textContent = 'Suchen';
      lastDiscoverResults = results;
      renderDiscoverList(results);
      statusD.textContent = results.length ? `${results.length} Sender` : 'Keine Sender gefunden';
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Suchen';
      list.innerHTML = '<div class="empty-msg">Verbindungsfehler</div>';
    }
  }

  async function searchDjSets(query) {
    const statusD = document.getElementById('discover-status');
    const list    = document.getElementById('discover-list');
    const genre   = document.getElementById('f-djgenre').value;
    try {
      // Pfad-Logik: Live-Kategorie und Genre-Filter via hearthis.at categories/feed/search
      let path;
      if (query) {
        // Freitext-Suche (optional auf Genre eingegrenzt)
        path = `search/?t=${encodeURIComponent(query)}${genre && genre !== 'livestreams' ? `&category=${genre}` : ''}&page=1&count=40`;
      } else if (genre === 'livestreams') {
        path = `categories/livestreams/?page=1&count=40`;
      } else if (genre) {
        path = `feed/?type=popular&category=${genre}&page=1&count=40`;
      } else {
        path = `feed/?type=popular&page=1&count=40`;
      }
      const raw = await window.__TAURI__.core.invoke('fetch_hearthis', { path });
      const results = JSON.parse(raw);
      if (!Array.isArray(results) || !results.length) {
        list.innerHTML = '<div class="empty-msg">Keine DJ Sets gefunden</div>';
        statusD.textContent = '';
        return;
      }
      const isLive = genre === 'livestreams';
      list.innerHTML = '';
      results.forEach(r => {
        if (!r.stream_url) return;
        const isActive = currentStreamUrl === r.stream_url;
        const duration = isLive ? '🔴 LIVE' : (r.duration ? formatDuration(parseInt(r.duration)) : '');
        const genre    = r.genre || r.tag_list || '';
        const div = document.createElement('div');
        div.className = 'station' + (isActive ? ' active' : '');
        div.innerHTML = `
          <div class="station-dot"></div>
          <div class="station-info">
            <div class="station-name">${esc(r.title || r.user?.username || '–')}</div>
            <div class="station-sub">${esc(r.user?.username || '')}${r.user?.username && (duration || genre) ? ' · ' : ''}${esc(duration)}${duration && genre ? ' · ' : ''}${esc(genre)}</div>
          </div>
          <button class="action-btn add-btn" title="Zu meinen Sendern hinzufügen">+</button>
        `;
        div.addEventListener('click', e => {
          if (e.target.classList.contains('add-btn')) return;
          list.querySelectorAll('.station').forEach(el => el.classList.remove('active'));
          div.classList.add('active');
          // Stop radio chain, switch to DJ mode (separate audio element with crossorigin)
          if (muteGain) muteGain.gain.setValueAtTime(0, audioCtx?.currentTime ?? 0);
          audio.pause();
          isDjMode = true;
          currentDjIsLive = isLive;
          currentIdx = -1;
          currentStreamUrl = r.stream_url;
          currentUrl = r.stream_url;
          setScrollingText(nowPlaying, r.title || r.user?.username || '–');
          nowGenreEl.textContent = genre || '';
          audioDj.src = r.stream_url;
          audioDj.volume = parseFloat(volumeEl.value);
          audioDj.play().catch(() => {});
          playing = true;
          setStatus('loading', 'Verbinde…');
          updatePlayBtn();
          // Seek-Leiste nur für aufgezeichnete Sets (nicht Live)
          resetSeek();
          document.getElementById('seek-row').classList.toggle('on', !isLive);
          renderMyList();
        });
        div.querySelector('.add-btn').addEventListener('click', () => {
          const name = r.title || r.user?.username || 'DJ Set';
          if (!stations.some(s => s.url === r.stream_url)) {
            stations.push({ name, url: r.stream_url, genre: genre || 'DJ Set' });
            saveData(); renderGenreBar(); renderMyList();
          }
          div.querySelector('.add-btn').textContent = '✓';
          div.querySelector('.add-btn').style.color = 'var(--accent)';
        });
        list.appendChild(div);
      });
      statusD.textContent = `${results.length} DJ Sets`;
    } catch(e) {
      list.innerHTML = '<div class="empty-msg">hearthis.at gerade nicht erreichbar – bitte erneut versuchen</div>';
      statusD.textContent = '';
    }
  }

  function formatDuration(secs) {
    if (!secs) return '';
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  }

  function renderDiscoverList(results) {
    const list = document.getElementById('discover-list');
    list.innerHTML = '';
    if (!results.length) { list.innerHTML = '<div class="empty-msg">Keine Sender gefunden</div>'; return; }

    results.forEach(r => {
      if (!r.url_resolved && !r.url) return;
      const url      = r.url_resolved || r.url;
      const genreLabel = GENRES.find(g => g.tag === activeDiscoverTag)?.label || (r.tags ? r.tags.split(',')[0].trim() : '');
      const isActive = currentStreamUrl === url;

      const div = document.createElement('div');
      div.className = 'station' + (isActive ? ' active' : '');
      div.innerHTML = `
        <div class="station-dot"></div>
        <div class="station-info">
          <div class="station-name">${esc(r.name)}</div>
          <div class="station-sub">${esc(r.country || '')}${r.country && genreLabel ? ' · ' : ''}${esc(genreLabel)}</div>
        </div>
        <button class="action-btn add-btn" title="Zu meinen Sendern hinzufügen">+</button>
      `;
      div.addEventListener('click', e => {
        if (e.target.classList.contains('add-btn')) return;
        playExternal(r.name, url, genreLabel);
        renderDiscoverList(results);
      });
      div.querySelector('.add-btn').addEventListener('click', () => {
        if (!stations.some(s => s.url === url)) {
          if (genreLabel && !genres.includes(genreLabel)) { genres.push(genreLabel); saveData(); }
          stations.push({ name: r.name, url, genre: genreLabel });
          saveData(); renderGenreBar(); renderMyList();
        }
        div.querySelector('.add-btn').textContent = '✓';
        div.querySelector('.add-btn').style.color = 'var(--accent)';
      });
      list.appendChild(div);
    });
  }

  document.getElementById('search-btn').addEventListener('click', searchStations);
  document.getElementById('f-network').addEventListener('keydown', e => { if (e.code === 'Enter') searchStations(); });
  document.getElementById('f-country').addEventListener('change', searchStations);
  document.getElementById('f-djgenre').addEventListener('change', searchStations);

  /* ── ICY Metadata Polling ── */
  let metaInterval = null;

  async function fetchTrackTitle(url) {
    if (!window.__TAURI__?.core) return;
    try {
      const title = await window.__TAURI__.core.invoke('fetch_icy_metadata', { url });
      setScrollingText(nowTrackEl, title || '');
      barTrackEl.textContent = title ? `— ${title}` : '';
    } catch(e) {
      setScrollingText(nowTrackEl, '');
      barTrackEl.textContent = '';
    }
  }

  function startMetaPoll(url) {
    stopMetaPoll();
    fetchTrackTitle(url);
    metaInterval = setInterval(() => fetchTrackTitle(url), 30000);
  }

  function stopMetaPoll() {
    if (metaInterval) { clearInterval(metaInterval); metaInterval = null; }
    setScrollingText(nowTrackEl, '');
    barTrackEl.textContent = '';
  }

  /* ── Tray Events ── */
  if (window.__TAURI__?.event) {
    const { listen } = window.__TAURI__.event;
    listen('tray-play',   () => { if (currentIdx === -1 && stations.length > 0) selectStation(0); else { audio.play(); playing = true; updatePlayBtn(); }});
    listen('tray-pause',  () => { audio.pause(); playing = false; updatePlayBtn(); });
    listen('tray-next',   () => { if (stations.length > 0) selectStation((currentIdx + 1) % stations.length); });
    listen('tray-volume', e  => { const v = parseFloat(e.payload); audio.volume = v; volumeEl.value = v; });
  }

  /* ── Keyboard Shortcuts ── */
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
      e.preventDefault();
      if (stations.length > 0) selectStation((currentIdx + 1) % stations.length);
    } else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (stations.length > 0) selectStation((currentIdx - 1 + stations.length) % stations.length);
    }
  });

  /* ── Init ── */
  loadData();
  renderGenreBar();
  renderMyList();
  loadFilters();

  // Zuletzt gespielten Sender wiederherstellen
  const lastIdx = parseInt(localStorage.getItem('radio_last') ?? '-1');
  if (lastIdx >= 0 && lastIdx < stations.length) {
    currentIdx = lastIdx;
    const s = stations[lastIdx];
    setScrollingText(nowPlaying, s.name);
    nowGenreEl.textContent = s.genre || '';
    renderMyList();
  }
</script>
</body>
</html>
